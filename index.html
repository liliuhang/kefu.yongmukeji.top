<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>昆象云科技智能客服-昆小象</title>
    <link rel="icon" href="https://hive.forms.usercontent.microsoft/Images/9188040d-6c67-4c5b-b112-36a304b66dad/00000000-0000-0000-0003-bffd409131bf/T0RRH45M4BJGVXSCOEE2GS5JAZ/fe1565ec-02bf-4b26-800f-b6b659adee28" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }
        .maintain-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 60px); 
            background: #000;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .maintain-mask.show {
            display: flex;
        }
        .maintain-mask h2 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #ffffff;
        }
        .maintain-mask p {
            font-size: 16px;
            color: #aaa;
            line-height: 1.6;
        }
        #chat-container {
            width: 100%;
            height: calc(100% - 60px);
        }
        .footer-copyright {
            width: 100%;
            height: 60px;
            background-color: #0066cc;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            padding: 4px 10px;
            text-align: center;
            overflow: hidden;
        }
        .footer-copyright a {
            color: #fff;
            text-decoration: none;
            margin: 0 6px;
        }
        .footer-copyright a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="maintain-mask" id="maintainMask">
        <h2>🚧系统维护中</h2>
        <p>客服系统正在维护，暂时无法提供服务，请稍后再访问。</p>
    </div>
    <div id="chat-container"></div>
    <script src="https://chatbot.weixin.qq.com/mmspraiweb_node/dist/static/script/H5_SDK_ACCESS.js"></script>
    <script>
        const maintainStart = '2026-10-06 00:00:00';
        const maintainEnd = '2026-10-06 23:59:59';
        const mask = document.getElementById('maintainMask');
        const now = new Date();
        const startTime = new Date(maintainStart);
        const endTime = new Date(maintainEnd);
        if (now >= startTime && now <= endTime) {
            mask.classList.add('show');
        } else {
            WxChat.init({
                appId: "xa8pVadXexnpYypLGlFKv3RQONcsq5",
                openId: "o9U-85kcLVi46uaEIq5etRi1BMnw",
                robotName: "昆象云科技智能客服",
                mode: "fullscreen",
                container: document.getElementById('chat-container')
            });
        }
        const currentYear = new Date().getFullYear();
        const footer = document.createElement('div');
        footer.className = 'footer-copyright';
        footer.innerHTML = `
            <div>© 2025-${currentYear} 昆明昆象云科技有限责任公司 版权所有</div>
            <div>
                <a href="https://kunxy.top/" target="_blank">昆象云科技官网</a>｜
                <a href="https://rule-portal.yongmukeji.top/" target="_blank">昆象云科技规章制度访问指引</a>｜
                <a href="https://yongmukeji.top/" target="_blank">永慕智创软件工作室官网</a>
            </div>
        `;
        document.body.appendChild(footer);
    </script>
</body>
</html>
